<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Void Runner — Raevix Arcade</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      background:
        radial-gradient(80% 50% at 50% 120%, rgba(255, 155, 61, 0.16), transparent 70%),
        radial-gradient(60% 40% at 20% 0%, rgba(255, 47, 77, 0.14), transparent 70%),
        #060309;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Void Runner game"></canvas>

  <div class="hud">
    <span>Score <b id="score">0</b></span>
    <span class="hud__mid">Void Runner</span>
    <span>Best <b id="best">0</b></span>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <p class="eyebrow">Raevix Arcade</p>
      <h1 id="overlayTitle">Void Runner</h1>
      <p id="overlayText">Weave through falling debris and scoop up energy orbs. The void accelerates the longer you survive.</p>
      <div class="keys" id="overlayKeys">
        <span>Mouse / Touch</span>
        <span>← →</span>
        <span>A / D</span>
      </div>
      <button class="btn" id="startBtn" type="button">Enter the void</button>
    </div>
  </div>

  <p class="hint">Dodge debris · collect orbs</p>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayText = document.getElementById('overlayText');
      const overlayKeys = document.getElementById('overlayKeys');
      const startBtn = document.getElementById('startBtn');

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

      let W = 0;
      let H = 0;
      let running = false;
      let elapsed = 0;
      let orbsCollected = 0;
      let score = 0;
      let best = Number(localStorage.getItem('raevix.void.best') || 0) || 0;
      let spawnTimer = 0.6;
      let orbTimer = 1.2;
      let last = performance.now();

      const player = { x: 0, y: 0, targetX: 0, r: 15 };
      const keys = { left: false, right: false };
      let obstacles = [];
      let orbs = [];
      let particles = [];
      let stars = [];

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.clientWidth || window.innerWidth;
        H = canvas.clientHeight || window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        player.y = H - Math.max(64, H * 0.12);
        if (!player.x) player.x = W / 2;
        player.x = clamp(player.x, 24, W - 24);
        player.targetX = clamp(player.targetX || player.x, 24, W - 24);

        stars = Array.from({ length: 70 }, () => ({
          x: Math.random() * W,
          y: Math.random() * H,
          size: 0.6 + Math.random() * 1.6,
          speed: 16 + Math.random() * 70
        }));
      }

      function spawnObstacle() {
        const w = 30 + Math.random() * Math.min(90, W * 0.16);
        const h = 46 + Math.random() * 90;
        obstacles.push({
          x: 16 + Math.random() * Math.max(10, W - 32 - w),
          y: -h - 30,
          w,
          h,
          drift: Math.random() * 50 - 25,
          hue: Math.random() > 0.6 ? '#ff7043' : '#ff2f4d'
        });
      }

      function spawnOrb() {
        orbs.push({
          x: 28 + Math.random() * Math.max(10, W - 56),
          y: -30,
          r: 9,
          wobble: Math.random() * Math.PI * 2
        });
      }

      function burst(x, y, color) {
        for (let i = 0; i < 10; i += 1) {
          const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.4;
          const speed = 60 + Math.random() * 130;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color
          });
        }
      }

      function updateHud() {
        scoreEl.textContent = String(score);
        bestEl.textContent = String(best);
      }

      function reset() {
        running = true;
        elapsed = 0;
        orbsCollected = 0;
        score = 0;
        spawnTimer = 0.55;
        orbTimer = 1;
        obstacles = [];
        orbs = [];
        particles = [];
        player.x = W / 2;
        player.targetX = W / 2;
        updateHud();
      }

      function showOverlay(title, text, label, showKeys) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        startBtn.textContent = label;
        overlayKeys.hidden = !showKeys;
        overlay.classList.remove('hidden');
      }

      function endRun() {
        running = false;
        best = Math.max(best, score);
        try { localStorage.setItem('raevix.void.best', String(best)); } catch (error) { /* ignore */ }
        updateHud();
        showOverlay('Run ended', `You scored ${score} points and collected ${orbsCollected} orbs. Best on this device: ${best}.`, 'Run again', false);
      }

      function startGame() {
        overlay.classList.add('hidden');
        reset();
      }

      startBtn.addEventListener('click', startGame);
      window.addEventListener('resize', resize);

      canvas.addEventListener('pointermove', (event) => {
        const rect = canvas.getBoundingClientRect();
        player.targetX = clamp(event.clientX - rect.left, 24, W - 24);
      });

      canvas.addEventListener('pointerdown', (event) => {
        if (!running) return;
        const rect = canvas.getBoundingClientRect();
        player.targetX = clamp(event.clientX - rect.left, 24, W - 24);
      });

      window.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'arrowleft' || key === 'a') {
          keys.left = true;
          event.preventDefault();
        } else if (key === 'arrowright' || key === 'd') {
          keys.right = true;
          event.preventDefault();
        } else if (key === ' ' || key === 'enter') {
          event.preventDefault();
          if (!running) startGame();
        }
      });

      window.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'arrowleft' || key === 'a') keys.left = false;
        if (key === 'arrowright' || key === 'd') keys.right = false;
      });

      window.addEventListener('blur', () => {
        keys.left = false;
        keys.right = false;
      });

      function update(dt) {
        stars.forEach((star) => {
          star.y += star.speed * dt * (running ? 1 : 0.35);
          if (star.y > H) {
            star.y = -4;
            star.x = Math.random() * W;
          }
        });

        if (!running) return;

        elapsed += dt;
        const cruise = 210 + Math.min(330, elapsed * 13);

        if (keys.left) player.targetX -= 520 * dt;
        if (keys.right) player.targetX += 520 * dt;
        player.targetX = clamp(player.targetX, 24, W - 24);
        player.x += (player.targetX - player.x) * Math.min(1, dt * 11);
        player.x = clamp(player.x, 22, W - 22);

        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnTimer = Math.max(0.32, 0.72 - elapsed * 0.012);
          spawnObstacle();
        }

        orbTimer -= dt;
        if (orbTimer <= 0) {
          orbTimer = 1.3 + Math.random() * 1.2;
          spawnOrb();
        }

        obstacles.forEach((obstacle) => {
          obstacle.y += (cruise + obstacle.drift) * dt;
        });
        obstacles = obstacles.filter((obstacle) => obstacle.y < H + 140);

        orbs.forEach((orb) => {
          orb.y += cruise * 0.9 * dt;
          orb.wobble += dt * 4;
          orb.drawX = orb.x + Math.sin(orb.wobble) * 6;
        });

        orbs = orbs.filter((orb) => {
          if (orb.y > H + 40) return false;
          const dx = (orb.drawX ?? orb.x) - player.x;
          const dy = orb.y - player.y;
          if (Math.hypot(dx, dy) < player.r + orb.r + 4) {
            orbsCollected += 1;
            burst(orb.drawX ?? orb.x, orb.y, '#5dffe0');
            return false;
          }
          return true;
        });

        const shipLeft = player.x - 13;
        const shipRight = player.x + 13;
        const shipTop = player.y - 16;
        const shipBottom = player.y + 14;

        for (const obstacle of obstacles) {
          if (
            shipRight > obstacle.x &&
            shipLeft < obstacle.x + obstacle.w &&
            shipBottom > obstacle.y &&
            shipTop < obstacle.y + obstacle.h
          ) {
            burst(player.x, player.y, '#ff2f4d');
            endRun();
            return;
          }
        }

        particles.forEach((particle) => {
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += 60 * dt;
          particle.life -= dt * 1.8;
        });
        particles = particles.filter((particle) => particle.life > 0);

        score = Math.floor(elapsed * 10) + orbsCollected * 40;
        if (score > best) {
          best = score;
          bestEl.textContent = String(best);
        }
        scoreEl.textContent = String(score);
      }

      function drawShip() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.shadowColor = 'rgba(255, 94, 112, 0.9)';
        ctx.shadowBlur = 22;

        const body = ctx.createLinearGradient(0, -18, 0, 16);
        body.addColorStop(0, '#fff2f4');
        body.addColorStop(0.4, '#ff8b9c');
        body.addColorStop(1, '#ff2f4d');
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(14, 14);
        ctx.lineTo(0, 8);
        ctx.lineTo(-14, 14);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 16;
        ctx.fillStyle = 'rgba(255, 220, 160, 0.9)';
        ctx.beginPath();
        ctx.moveTo(-5, 9);
        ctx.lineTo(0, 20 + Math.sin(elapsed * 22) * 4);
        ctx.lineTo(5, 9);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        ctx.fillStyle = '#0a0510';
        ctx.fillRect(0, 0, W, H);

        const mist = ctx.createLinearGradient(0, 0, 0, H);
        mist.addColorStop(0, 'rgba(255, 47, 77, 0.12)');
        mist.addColorStop(0.6, 'rgba(20, 6, 18, 0.1)');
        mist.addColorStop(1, 'rgba(255, 155, 61, 0.1)');
        ctx.fillStyle = mist;
        ctx.fillRect(0, 0, W, H);

        stars.forEach((star) => {
          ctx.save();
          ctx.globalAlpha = 0.25 + star.size / 4;
          ctx.fillStyle = '#ffd8de';
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        obstacles.forEach((obstacle) => {
          ctx.save();
          ctx.globalAlpha = 0.16;
          ctx.fillStyle = obstacle.hue;
          ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
          ctx.restore();

          ctx.save();
          ctx.shadowColor = obstacle.hue;
          ctx.shadowBlur = 16;
          ctx.strokeStyle = obstacle.hue;
          ctx.lineWidth = 2;
          ctx.strokeRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
          ctx.restore();
        });

        orbs.forEach((orb) => {
          const x = orb.drawX ?? orb.x;
          ctx.save();
          ctx.shadowColor = 'rgba(93, 255, 224, 0.9)';
          ctx.shadowBlur = 18;
          const gradient = ctx.createRadialGradient(x - 2, orb.y - 2, 1, x, orb.y, orb.r + 4);
          gradient.addColorStop(0, '#eafffb');
          gradient.addColorStop(1, '#2fd6bd');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(x, orb.y, orb.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        particles.forEach((particle) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, particle.life);
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, 2.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        if (running || score > 0) drawShip();

        if (running) {
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 94, 112, 0.16)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, player.y + 26);
          ctx.lineTo(W, player.y + 26);
          ctx.stroke();
          ctx.restore();
        }
      }

      function loop(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      resize();
      updateHud();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
