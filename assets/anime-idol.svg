  <path stroke="#a83e60" stroke-width="3.4" stroke-linecap="round" fill="none" d="M336 382C343 389 357 389 364 382"/>
  <path stroke="#ff9bb9" stroke-width="1.6" stroke-linecap="round" fill="none" d="M342 390C347 393 353 393 358 390" opacity=".7"/>

  <!-- Star clip -->
  <g transform="translate(272 205) scale(1.5)" filter="url(#idolGlow)">
    <path fill="#ffe9a8" d="M0 -12L3.2 -4.4L11.4 -4.2L4.9 1L7.1 8.8L0 4.2L-7.1 8.8L-4.9 1L-11.4 -4.2L-3.2 -4.4Z"/>
  </g>

  <!-- Headset -->
  <path stroke="#190820" stroke-width="13" fill="none" stroke-linecap="round" d="M244 300C244 186 456 186 456 300"/>
  <path stroke="#ff5aa5" stroke-opacity=".55" stroke-width="2.4" fill="none" stroke-linecap="round" d="M248 292C254 194 446 194 452 292"/>
