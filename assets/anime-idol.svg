  <path fill="url(#idolHairFront)" d="M248 292C237 206 284 158 350 156C416 158 463 206 452 292C436 250 410 222 386 212C392 242 388 268 376 294C364 256 346 230 326 218C328 252 318 282 300 302C292 266 276 242 260 232C264 256 258 278 248 292Z"/>
