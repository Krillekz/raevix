<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1000" width="700" height="1000" role="img" aria-label="Anime idol character with twin tails and a glowing headset">
  <defs>
    <linearGradient id="idolHairBack" x1="190" y1="140" x2="520" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#561038"/>
      <stop offset=".55" stop-color="#2c0b27"/>
      <stop offset="1" stop-color="#160615"/>
    </linearGradient>
    <linearGradient id="idolHairFront" x1="250" y1="150" x2="440" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9dcf"/>
      <stop offset=".5" stop-color="#e0418f"/>
      <stop offset="1" stop-color="#7d1550"/>
    </linearGradient>
    <linearGradient id="idolSkin" x1="260" y1="180" x2="440" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0ea"/>
      <stop offset="1" stop-color="#f2c3c8"/>
    </linearGradient>
    <linearGradient id="idolJacket" x1="170" y1="470" x2="530" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a0e2c"/>
      <stop offset=".55" stop-color="#180a20"/>
      <stop offset="1" stop-color="#0c050f"/>
    </linearGradient>
    <linearGradient id="idolIris" x1="288" y1="306" x2="316" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ff2ff"/>
      <stop offset=".5" stop-color="#7ea8ff"/>
      <stop offset="1" stop-color="#b06bff"/>
    </linearGradient>
    <radialGradient id="idolBlush" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff8fae" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff8fae" stop-opacity="0"/>
    </radialGradient>
    <filter id="idolGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      #idolTailL { transform-origin: 242px 280px; animation: idol-sway 8s ease-in-out infinite; }
      #idolTailR { transform-origin: 458px 280px; animation: idol-sway 9.5s ease-in-out infinite reverse; }
      #idolEarring { animation: idol-glint 3.6s ease-in-out infinite; }
      @keyframes idol-sway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-1.8deg); }
      }
      @keyframes idol-glint {
        0%, 100% { opacity: .55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #idolTailL, #idolTailR, #idolEarring { animation: none; }
      }
    </style>
  </defs>

  <!-- Back hair -->
  <path fill="url(#idolHairBack)" d="M350 118C256 118 196 186 194 282C192 344 212 392 200 452C188 514 176 562 166 612C210 582 244 540 260 490L440 490C456 540 490 582 534 612C524 562 512 514 500 452C488 392 508 344 506 282C504 186 444 118 350 118Z"/>

