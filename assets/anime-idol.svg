  <g id="idolTailR">
    <path fill="url(#idolHairBack)" d="M462 252C502 336 516 442 512 546C508 646 524 746 542 828C500 786 468 704 454 622C442 542 438 440 444 356Z"/>
    <path fill="#ff5aa5" opacity=".28" d="M474 300C496 400 502 520 496 620C502 520 488 396 466 310Z"/>
