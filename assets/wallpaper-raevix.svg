<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Raevix neon desktop wallpaper">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0407"/>
      <stop offset=".45" stop-color="#0d0509"/>
      <stop offset="1" stop-color="#050205"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".16" cy=".1" r=".62">
      <stop offset="0" stop-color="#ff2b4a" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#a30f28" stop-opacity=".14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".9" cy=".84" r=".55">
      <stop offset="0" stop-color="#ff365a" stop-opacity=".2"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx=".56" cy=".02" r=".5">
      <stop offset="0" stop-color="#ff6b7f" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ff4d63" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="grid2" width="256" height="256" patternUnits="userSpaceOnUse">
      <path d="M256 0H0V256" fill="none" stroke="#ff4d63" stroke-opacity=".075" stroke-width="1.4"/>
    </pattern>
    <pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ff8b9c" fill-opacity=".14"/>
    </pattern>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2b4a" stop-opacity="0"/>
      <stop offset=".55" stop-color="#ff2b4a" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ff2b4a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".78">
      <stop offset=".45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".8"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#grid2)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <rect width="1920" height="1080" fill="url(#glow3)"/>

  <g fill="none" stroke="#ff3355" stroke-opacity=".22">
    <path d="M-60 300C260 226 435 372 690 330S1150 148 1420 220s355 240 610 214" stroke-width="1.4"/>
    <path d="M-60 336C260 262 435 408 690 366S1150 184 1420 256s355 240 610 214" stroke-width=".8" stroke-opacity=".12"/>
    <path d="M-80 740c300-64 520 52 760 14s470-190 740-120 360 170 600 132" stroke-width="1.1" stroke-opacity=".14"/>
  </g>

  <g stroke="url(#horizon)" stroke-width="1">
    <path d="M0 820h1920"/>
    <path d="M0 862h1920" stroke-opacity=".55"/>
    <path d="M0 908h1920" stroke-opacity=".35"/>
  </g>

  <g fill="none" stroke="#ff4d63" stroke-opacity=".16">
    <path d="M960 1080 690 780h540Z" stroke-width="1.4"/>
    <path d="M960 1080 430 780h210" stroke-width=".9"/>
    <path d="M960 1080 1490 780h-210" stroke-width=".9"/>
  </g>

  <g fill="#ffd3da" fill-opacity=".45">
    <circle cx="318" cy="176" r="1.6"/>
    <circle cx="1490" cy="268" r="1.4"/>
    <circle cx="1210" cy="132" r="1.2"/>
    <circle cx="742" cy="502" r="1.3"/>
    <circle cx="1662" cy="566" r="1.6"/>
    <circle cx="452" cy="654" r="1.2"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
